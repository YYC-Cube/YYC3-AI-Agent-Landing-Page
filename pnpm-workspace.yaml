packages: []

# 供应链防护：仅允许发布满 24 小时的版本进入 lockfile（防新版本投毒）
minimumReleaseAge: 1440

# 传递依赖安全覆盖（Dependabot GHSA 修复下限）
overrides:
  "browserslist@<4.28.7": "^4.28.7"
  "nanoid@<3.3.18": "^3.3.18"
  "baseline-browser-mapping@<2.11.0": "^2.11.0"
  "postcss@<=8.5.22": "^8.5.23"

# pnpm 11+ 依赖构建脚本策略（allowBuilds 取代 v10 的 onlyBuiltDependencies）
allowBuilds:
  "@tsparticles/engine": true
  unrs-resolver: true
